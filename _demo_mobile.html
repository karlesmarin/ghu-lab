<!doctype html>
<meta charset="utf-8">
<title>mobile bench</title>
<!-- A bench for the narrow layout.  Resizing the browser window through the automation tool does
     not reach the page's viewport, so the app is loaded in an iframe of phone width instead: inside
     it, innerWidth really is 390 and every media query fires as it would on a handset.  Not part of
     the app; the build does not ship it. -->
<style>
  body { margin:0; padding:16px; background:#e9edf1; font:13px system-ui; }
  .row { display:flex; gap:18px; align-items:flex-start; }
  figure { margin:0; }
  figcaption { font-size:12px; color:#5d6b79; margin:0 0 6px; }
  iframe { border:1px solid #c8d0d8; border-radius:12px; background:#fff; display:block; }
</style>
<div class="row">
  <figure><figcaption>390 &times; 780 &mdash; phone</figcaption>
    <iframe id="phone" src="app/index.html#s=orbifold" width="390" height="780"></iframe></figure>
  <figure><figcaption>744 &times; 780 &mdash; tablet</figcaption>
    <iframe id="tablet" src="app/index.html#s=relations" width="744" height="780"></iframe></figure>
</div>
